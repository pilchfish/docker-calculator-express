events {}

http {
  map $http_x_api_key $is_authorized {
    default 0;
    "burgerking" 1;
  }

  server {
    listen 80;

    location / {
      if ($is_authorized = 0) {
        return 403;
      }

      proxy_pass http://gateway:8080;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

# map $http_x_api_key $is_authorized — reads the incoming X - API - Key header, and sets $is_authorized to 1 only if it matches your secret exactly, 0 otherwise(this includes the header being completely absent — that also lands in default) if ($is_authorized = 0) { return 403; }
# — reject anything that didn't match proxy_pass http: // gateway:8080 — otherwise, forward on to the gateway, using the same container-to-container networking you already understand from building the gateway itself
# $remote_addr — nginx's built-in variable for the actual IP that connected to it (your Mac, your phone, wherever)
# $host — the Host header the original request came in with
# $scheme — http or https, whichever the original request used

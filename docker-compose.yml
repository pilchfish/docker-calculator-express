services:
  add-service:
    build:
      context: .
      dockerfile: calculator-microservices/add-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - ENDPOINT=/add
      - SERVER_TYPE=add-service
      - SYMBOL=+
    develop:
      watch:
        - action: sync+restart
          path: ./calculator-microservices/add-service
          target: /app/calculator-microservices/add-service
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./shared
          target: /app/shared

  subtract-service:
    build:
      context: .
      dockerfile: calculator-microservices/subtract-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - ENDPOINT=/subtract
      - SERVER_TYPE=subtract-service
      - SYMBOL=-
    develop:
      watch:
        - action: sync+restart
          path: ./calculator-microservices/subtract-service
          target: /app/calculator-microservices/subtract-service
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./shared
          target: /app/shared
        - action: rebuild
          path: ./calculator-microservices/subtract-service/package.json

  multiply-service:
    build:
      context: .
      dockerfile: calculator-microservices/multiply-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - ENDPOINT=/multiply
      - SERVER_TYPE=multiply-service
      - SYMBOL=*
    develop:
      watch:
        - action: sync+restart
          path: ./calculator-microservices/multiply-service
          target: /app/calculator-microservices/multiply-service
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./shared
          target: /app/shared
        - action: rebuild
          path: ./calculator-microservices/multiply-service/package.json

  divide-service:
    build:
      context: .
      dockerfile: calculator-microservices/divide-service/Dockerfile
    ports:
      - "8084:8080"
    environment:
      - PORT=8080
      - ENDPOINT=/divide
      - SERVER_TYPE=divide-service
      - SYMBOL=/
    develop:
      watch:
        - action: sync+restart
          path: ./calculator-microservices/divide-service
          target: /app/calculator-microservices/divide-service
          ignore:
            - node_modules/
        - action: sync+restart
          path: ./shared
          target: /app/shared
        - action: rebuild
          path: ./calculator-microservices/divide-service/package.json

  gateway:
    build:
      context: .
      dockerfile: calculator-microservices/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    depends_on:
      - add-service
      - subtract-service
      - multiply-service
      - divide-service
    develop:
      watch:
        - action: sync
          path: ./calculator-microservices/gateway
          target: /app/gateway
